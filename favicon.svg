<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo azul oscuro con bordes redondeados -->
  <rect width="512" height="512" fill="#1e3a8a" rx="80"/>

  <!-- Calendario en la parte superior izquierda -->
  <g transform="translate(40, 60)">
    <!-- Marco del calendario -->
    <rect x="0" y="0" width="180" height="200" fill="#ffffff" rx="15"/>

    <!-- Cabecera del calendario (roja) -->
    <rect x="0" y="0" width="180" height="50" fill="#ef4444" rx="15"/>
    <rect x="0" y="25" width="180" height="25" fill="#ef4444"/>

    <!-- Argollas del calendario -->
    <circle cx="40" cy="15" r="8" fill="#1e3a8a"/>
    <circle cx="90" cy="15" r="8" fill="#1e3a8a"/>
    <circle cx="140" cy="15" r="8" fill="#1e3a8a"/>

    <!-- Número del día en el calendario -->
    <text x="90" y="145" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#1e3a8a" text-anchor="middle">15</text>

    <!-- Mini cuadrados representando días -->
    <rect x="15" y="70" width="20" height="15" fill="#dbeafe" rx="3"/>
    <rect x="45" y="70" width="20" height="15" fill="#dbeafe" rx="3"/>
    <rect x="75" y="70" width="20" height="15" fill="#dbeafe" rx="3"/>
    <rect x="105" y="70" width="20" height="15" fill="#dbeafe" rx="3"/>
    <rect x="135" y="70" width="20" height="15" fill="#dbeafe" rx="3"/>
  </g>

  <!-- Bolsa de dinero en la parte inferior derecha -->
  <g transform="translate(260, 240)">
    <!-- Cuerpo de la bolsa -->
    <ellipse cx="110" cy="150" rx="90" ry="100" fill="#10b981"/>

    <!-- Sombra/detalle de la bolsa -->
    <ellipse cx="110" cy="150" rx="70" ry="80" fill="#059669"/>

    <!-- Nudo/cierre de la bolsa -->
    <rect x="80" y="50" width="60" height="30" fill="#10b981" rx="15"/>
    <path d="M 80 65 Q 70 45, 80 35 L 140 35 Q 150 45, 140 65 Z" fill="#10b981"/>

    <!-- Símbolo de peso colombiano $ grande -->
    <text x="110" y="175" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>

    <!-- Brillo en la bolsa -->
    <ellipse cx="85" cy="120" rx="15" ry="25" fill="#34d399" opacity="0.6"/>
  </g>

  <!-- Elementos decorativos - monedas flotantes -->
  <circle cx="420" cy="100" r="25" fill="#fbbf24"/>
  <text x="420" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#92400e" text-anchor="middle">$</text>

  <circle cx="100" cy="420" r="30" fill="#fbbf24"/>
  <text x="100" y="435" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#92400e" text-anchor="middle">$</text>

  <circle cx="450" cy="380" r="20" fill="#fcd34d"/>
  <text x="450" y="390" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#92400e" text-anchor="middle">$</text>
</svg>
